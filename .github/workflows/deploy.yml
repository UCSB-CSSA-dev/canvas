name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Deploy Convex and build site
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Require CONVEX_DEPLOY_KEY
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
        run: |
          if [ -z "$CONVEX_DEPLOY_KEY" ]; then
            echo "::error::Add the CONVEX_DEPLOY_KEY repository secret (Convex dashboard > Settings > Deploy keys > Production)."
            exit 1
          fi

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Pushes Convex functions/schema to production, then builds the frontend
      # with NEXT_PUBLIC_CONVEX_URL pointed at that deployment.
      - name: Deploy Convex and build frontend
        working-directory: backend
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: >
          npx convex deploy
          --cmd 'npm run build --prefix ../frontend'
          --cmd-url-env-var-name NEXT_PUBLIC_CONVEX_URL

      - uses: actions/upload-pages-artifact@v4
        with:
          path: frontend/out

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
