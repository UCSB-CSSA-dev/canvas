name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm test

      - name: i18n keys match
        run: npm run check:i18n

      - name: Static build
        run: npm run build
        env:
          # Placeholder: the build only needs a syntactically valid URL.
          NEXT_PUBLIC_CONVEX_URL: https://placeholder-123.convex.cloud
          NEXT_PUBLIC_BASE_PATH: /canvas
